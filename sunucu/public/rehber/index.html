<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Panik Butonu Rehberi</title>
<style>
  :root {
    --zemin: #f8f1e6; --kart: #fffdf8; --yazi: #2b2520; --soluk: #85786b; --cizgi: #e6dccb;
    --vurgu: #e2561b; --kod: #1f1d1b; --kodYazi: #e9e2d6;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overflow: hidden; }
  body { background: var(--zemin); color: var(--yazi); font: 15px/1.5 system-ui, "Segoe UI", sans-serif;
         display: grid; grid-template-columns: 1fr 440px; }
  #sahne { position: relative; min-height: 0; }
  #sahne canvas { display: block; width: 100%; height: 100%; touch-action: none; }
  #ipucu { position: absolute; left: 14px; bottom: 12px; font-size: 12px; color: var(--soluk); pointer-events: none; }
  #yukleniyor { position: absolute; inset: 0; display: grid; place-items: center; color: var(--soluk); }

  .etiket { position: absolute; transform: translate(-50%, calc(-100% - 10px)); pointer-events: none; white-space: nowrap;
            background: var(--vurgu); color: #fff; font: 600 12px/1 ui-monospace, Consolas, monospace; padding: 4px 6px; border-radius: 5px; }
  .etiket::after { content: ""; position: absolute; left: 50%; top: 100%; margin-left: -5px; border: 5px solid transparent; border-top-color: var(--vurgu); }
  .etiket.gizli { display: none; }
  #balon { position: absolute; pointer-events: none; background: var(--kod); color: #fff; font-size: 13px; padding: 5px 8px; border-radius: 6px;
           transform: translate(12px, 12px); display: none; max-width: 260px; }

  aside { background: var(--kart); border-left: 1px solid var(--cizgi); display: flex; flex-direction: column; min-height: 0; }
  .ust { padding: 18px 22px 6px; }
  #adimNo { font-size: 12px; letter-spacing: .1em; text-transform: uppercase; color: var(--vurgu); font-weight: 700; }
  h1 { font-size: 22px; line-height: 1.2; margin: 4px 0 0; }
  #icerik { padding: 6px 22px 16px; overflow: auto; flex: 1; min-height: 0; }
  #icerik p { margin: 8px 0; }
  #icerik ol, #icerik ul { padding-left: 20px; margin: 8px 0; }
  #icerik li { margin: 4px 0; }
  code, .k { font-family: ui-monospace, Consolas, monospace; font-size: .92em; background: #f1e9db; padding: 1px 5px; border-radius: 4px; }
  .uyari { background: #fff1e0; border-left: 3px solid var(--vurgu); padding: 8px 10px; border-radius: 4px; margin: 10px 0; font-size: 14px; }
  .not { color: var(--soluk); font-size: 14px; }
  .kablo { display: inline-block; width: 22px; height: 6px; border-radius: 3px; vertical-align: middle; margin-right: 4px; border: 1px solid #0003; }
  table.parca { border-collapse: collapse; width: 100%; font-size: 14px; }
  table.parca td { border-bottom: 1px solid var(--cizgi); padding: 4px 2px; }
  table.parca td:last-child { text-align: right; color: var(--soluk); }

  #kod { background: var(--kod); color: var(--kodYazi); border-radius: 8px; padding: 10px 0; font: 12.5px/1.55 ui-monospace, Consolas, monospace; overflow-x: auto; margin: 10px 0; }
  #kod .satir { padding: 0 12px; white-space: pre; border-left: 3px solid transparent; transition: background .15s; }
  #kod .satir.aktif { background: #e2561b44; border-left-color: var(--vurgu); }
  #kod .yorum { color: #8d8478; }
  #seri { background: #111; color: #9fe39f; border-radius: 8px; padding: 8px 12px; font: 12.5px/1.5 ui-monospace, Consolas, monospace; height: 150px; overflow: auto; }
  #seri .baslik { color: #777; }
  #seri .kirmizi { color: #ff8a80; }
  .kontroller { display: flex; gap: 8px; flex-wrap: wrap; margin: 10px 0; }
  .kontroller button { font: inherit; font-weight: 600; border-radius: 8px; padding: 8px 12px; cursor: pointer; border: 1px solid var(--cizgi); background: #fff; }
  .kontroller .panik { background: #d93025; color: #fff; border-color: #a1170f; }

  .alt { display: flex; align-items: center; gap: 10px; padding: 12px 22px; border-top: 1px solid var(--cizgi); }
  .alt button { font: inherit; font-weight: 600; padding: 9px 16px; border-radius: 9px; border: 1px solid var(--cizgi); background: #fff; cursor: pointer; }
  .alt button.ana { background: var(--yazi); color: #fff; border-color: var(--yazi); }
  .alt button:disabled { opacity: .35; cursor: default; }
  #noktalar { flex: 1; display: flex; gap: 5px; justify-content: center; flex-wrap: wrap; }
  #noktalar span { width: 9px; height: 9px; border-radius: 50%; background: var(--cizgi); cursor: pointer; }
  #noktalar span.tamam { background: #c9b9a3; }
  #noktalar span.simdi { background: var(--vurgu); }

  @media (max-width: 900px) {
    body { grid-template-columns: 1fr; grid-template-rows: 46vh 1fr; }
    aside { border-left: 0; border-top: 1px solid var(--cizgi); }
    .ust { padding: 12px 16px 4px; } #icerik { padding: 4px 16px 12px; } .alt { padding: 10px 16px; }
  }
</style>
<script type="importmap">
{ "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
} }
</script>
</head>
<body>
<div id="sahne">
  <div id="yukleniyor">3D sahne yükleniyor…</div>
  <div id="balon"></div>
  <div id="ipucu">Sürükle: çevir · Tekerlek: yakınlaş · Sağ tık: kaydır</div>
</div>
<aside>
  <div class="ust">
    <div id="adimNo"></div>
    <h1 id="baslik"></h1>
  </div>
  <div id="icerik"></div>
  <div class="alt">
    <button id="geri">← Geri</button>
    <div id="noktalar"></div>
    <button id="ileri" class="ana">İleri →</button>
  </div>
</aside>
<script type="module" src="rehber.js"></script>
</body>
</html>
